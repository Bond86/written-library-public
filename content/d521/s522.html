<p dir="auto" id="passage-1">لأن سلطان الموت قد استُنفِذ في جسد الرب، فلا يعود للموت سلطانٌ على أجساد البشر (المماثلة لجسد الرب). ثانيًا: وأيضًا فإن البشر الذين رجعوا إلى الفساد بالمعصية، يُعيدهم إلى عدم الفساد ويُحييهم من الموت بالجسد الذي جعله جسده الخاص، وبنعمة القيامة يُبيد الموت منهم كما تُبيد النار القشّ.</p>
