<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحرير نصوص المكتبة</title><link rel="stylesheet" href="../assets/site.css"><body><header><span class="brand">محرر نصوص المكتبة</span><span>تعمل الملفات على جهازك</span></header><main><h1>تعديل مادة في المكتبة</h1><p>اختر ملف القسم من مجلد content، عدّل النص، ثم نزّل النسخة الجديدة وارفعها مكان الملف نفسه في GitHub.</p><section class="panel"><h2>بيانات المادة</h2><p><button id="new-document">مادة جديدة</button></p><p id="folder"></p><label>افتح ملف metadata.json <input id="open-metadata" type="file" accept=".json"></label><p><label>العنوان <input id="title"></label></p><p><label>المؤلف <input id="author"></label></p><p><label>التاريخ <input id="date" type="date"></label></p><p><label>النوع <select id="type"><option value="article">مقالات</option><option value="lecture">محاضرات</option><option value="book">كتب</option></select></label></p><button id="save-metadata">تنزيل بيانات المادة</button></section><section class="panel"><h2>النص المنسّق</h2><p><label>القسم <select id="section"></select></label> <button id="new-section">إضافة قسم</button></p><p><label>عنوان القسم <input id="section-heading"></label></p><p><label>الفصل <input id="section-chapter"></label></p><p><label>الترتيب <input id="section-position" type="number" min="0"></label></p><label>افتح قسم HTML <input id="open-section" type="file" accept=".html"></label><p id="filename">لم يُفتح قسم بعد</p><p class="reading-tools"><button data-command="bold">عريض</button><button data-command="italic">مائل</button><button data-command="formatBlock:h2">عنوان</button><button data-command="formatBlock:p">فقرة</button><button data-command="insertUnorderedList">قائمة</button><button data-command="insertOrderedList">ترقيم</button><button data-command="formatBlock:blockquote">اقتباس</button><button id="table">جدول</button></p><div id="rich" class="prose panel" contenteditable="true" role="textbox" aria-multiline="true" aria-label="محرر النص"></div><p><button id="save-section">تنزيل القسم المعدّل</button></p></section><p id="message" role="status"></p></main><script src="editor.bundle.js"></script></body></html>
