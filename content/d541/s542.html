<p dir="auto" id="passage-1">لقد أعطى الله الصالح البشر نصيبًا في صورته، أي في ربنا يسوع المسيح، وجعلهم هم أيضًا على الصورة والمثال نفسيهما. لماذا؟ لكي يستطيعوا، من خلال عطية التشبه بالله التي فيهم، أن يدركوا الصورة المطلقة، أي الكلمة نفسه، ومن خلاله يعرفوا الآب؛ لأن معرفة صانعهم هي للبشر الحياة الوحيدة السعيدة والمباركة حقًا.</p>
