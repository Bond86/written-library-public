<p dir="auto" id="passage-1">النار المعدة لعذاب الشيطان وملائكته تفصل بصوت الرب بين كونها حارقة للبعض ومنيرة للبعض الآخر؛ لذلك فإن صوت الرب هو الذي يفصل ويميز بين أن تكون نار الروح القدس؛ للذين في الظلمة تسبب احتراقًا وعذابًا (دينونة)؛ بينما نفس النار تسبب للذين في النور تمتع وابتهاج وفرح بالنور الذي أنارهم هم أيضًا</p>
